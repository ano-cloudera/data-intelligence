# =============================================================================
# domain_config.yaml — Domain Customization File
# =============================================================================
# Edit file ini ketika kamu deploy Ask Data untuk use case atau dataset berbeda.
# Tidak perlu mengubah kode Python sama sekali — cukup sesuaikan nilai di sini.
#
# Setelah diedit, restart APP 2 (Backend) agar perubahan berlaku.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Identitas bisnis
# -----------------------------------------------------------------------------
business_name: "Bank XYZ"

# Deskripsi singkat use case — dipakai di system prompt dan conversation prompt
business_domain: "dormant customer risk analysis, credit risk scoring, churn prediction, customer segmentation, campaign recommendations, and behavioral analytics"

# -----------------------------------------------------------------------------
# 2. Database & tabel utama
# -----------------------------------------------------------------------------
# Nama database dan tabel dikontrol oleh env vars DB_NAME dan SQL_ALLOWED_TABLES.
# Nilai di bawah ini dipakai di schema context dan prompt — harus konsisten
# dengan env vars tersebut.
database_name: "cai_sdx_se_indonesia"
table_name: "customer_segments_staging"
table_description: "AI-enriched customer profile with segmentation, credit risk, churn, and behavioral analytics"
table_grain: "one row per account (no_rekening) at reference period t0"

# -----------------------------------------------------------------------------
# 3. Scope bisnis — dipakai di system prompt
# Setiap item adalah satu bullet point yang menjelaskan area analitik yang didukung
# -----------------------------------------------------------------------------
business_scope:
  - "Account status: distribution of Aktif (status_rekening=0), Dormant (=1), Tutup (=2)."
  - "Cluster segmentation: K-Means clusters — Silent Mature, Young Syariah Digital, Konvensional Produktif."
  - "RFM segmentation: Champions, Loyal, Potential, At Risk, Lost."
  - "Credit risk: credit_score (300-850), credit_risk_label (GOOD/FAIR/POOR/BAD) per cluster and account."
  - "Churn prediction: churn_probability (0-1), churn_risk_label (HIGH/MEDIUM/LOW) per segment."
  - "Behavioral analytics: hari_sejak_trx (days since last transaction), total_tx, rasio_kredit, activity_level."
  - "Product analytics: jenis (SYARIAH vs KONVEN), jenis_rekening (product type), loan_type (KPR/KKB/KTA/None)."
  - "Digital adoption: digital_banking_adoption (Active/Passive/None) per cluster."
  - "Balance analytics: saldo_t0 (account balance at reference date), saldo_segment (tier label)."
  - "Demographic context: umur, jenis_kelamin, age_group, cabang_name, kota."
  - "Geospatial: lat/lng coordinates for city-level mapping across Indonesia."

# -----------------------------------------------------------------------------
# 4. Schema tabel — kolom-kolom yang tersedia
# Dipakai oleh schema_context.py untuk memberi LLM deskripsi kolom yang akurat.
# Tambah/hapus kolom sesuai skema data aktual kamu.
# -----------------------------------------------------------------------------
columns:
  # Identitas
  - name: cif
    description: "customer identification number (synthetic, no real PII)"
  - name: no_rekening
    description: "account number (synthetic)"
  - name: jenis
    description: "account type: SYARIAH or KONVEN (conventional)"
  - name: jenis_rekening
    description: "product name, e.g. TABUNGAN IB BAROKAH, GIRO"
  - name: cabang
    description: "branch code, e.g. 611"
  - name: cabang_name
    description: "branch full name, e.g. KC Surabaya Gubeng"
  - name: kota
    description: "city/kabupaten name"
  - name: lat
    description: "latitude coordinate of the branch city"
  - name: lng
    description: "longitude coordinate of the branch city"
  # Saldo & Transaksi
  - name: saldo_t0
    description: "account balance at reference period t0 (Rupiah)"
  - name: total_tx
    description: "total number of transactions"
  - name: hari_sejak_trx
    description: "days since last transaction; higher = less active"
  - name: rasio_kredit
    description: "ratio of credit transactions to total (0-1)"
  - name: t0
    description: "reference date of the scoring period"
  # Demografis
  - name: umur
    description: "customer age in years"
  - name: jenis_kelamin
    description: "gender code: P=Perempuan, L=Laki-laki"
  - name: jenis_kelamin_label
    description: "gender label: Perempuan / Laki-laki / Tidak Diketahui"
  - name: age_group
    description: "age group: Muda (<30) / Dewasa (30-45) / Matang (45-60) / Senior (>60)"
  # Status
  - name: status_rekening
    description: "account status: 0=Aktif, 1=Dormant, 2=Tutup (integer, no CAST needed)"
  - name: status_label
    description: "status label: Aktif / Dormant / Tutup"
  - name: activity_level
    description: "activity level label based on hari_sejak_trx"
  - name: saldo_segment
    description: "balance tier: Rendah (<1jt) / Menengah (1-10jt) / Tinggi (10-100jt) / Premium (>100jt)"
  # Segmentasi K-Means
  - name: cluster_kmeans
    description: "K-Means cluster: 0=Silent Mature, 1=Young Syariah Digital, 2=Konvensional Produktif"
  - name: cluster_label
    description: "cluster label: Silent Mature / Young Syariah Digital / Konvensional Produktif"
  - name: cluster_color
    description: "hex color for cluster visualization"
  # RFM
  - name: rfm_r
    description: "RFM Recency score 1-5 (5=most recent)"
  - name: rfm_f
    description: "RFM Frequency score 1-5 (5=most frequent)"
  - name: rfm_m
    description: "RFM Monetary score 1-5 (5=highest balance)"
  - name: rfm_score
    description: "Total RFM score (3-15)"
  - name: rfm_segment
    description: "RFM segment: Champions / Loyal / Potential / At Risk / Lost"
  # GMM Clustering
  - name: cluster_gmm
    description: "GMM cluster ID (0-7)"
  - name: gmm_max_prob
    description: "highest cluster probability from GMM"
  - name: gmm_entropy
    description: "entropy of GMM probability distribution"
  # Credit Risk (NEW)
  - name: credit_score
    description: "credit score 300-850; higher = better credit quality"
  - name: credit_risk_label
    description: "credit risk: GOOD (>=750), FAIR (650-749), POOR (550-649), BAD (<550)"
  # Churn (NEW)
  - name: churn_probability
    description: "churn probability 0-1; higher = more likely to churn"
  - name: churn_risk_label
    description: "churn risk: HIGH (>=0.65), MEDIUM (0.35-0.64), LOW (<0.35)"
  # Product & Digital (NEW)
  - name: loan_type
    description: "loan product type: KPR (mortgage), KKB (vehicle loan), KTA (unsecured), None"
  - name: digital_banking_adoption
    description: "digital banking adoption: Active, Passive, None"

# -----------------------------------------------------------------------------
# 5. Business term mappings — istilah bisnis ke nama kolom
# Dipakai di query guidance agar LLM tahu terjemahan istilah lokal ke kolom SQL
# -----------------------------------------------------------------------------
term_mappings:
  - term: "nasabah dormant"
    column: "status_rekening = 1"
  - term: "dormant"
    column: "status_rekening = 1"
  - term: "rekening tutup"
    column: "status_rekening = 2"
  - term: "rekening aktif"
    column: "status_rekening = 0"
  - term: "segmentasi"
    column: "cluster_label"
  - term: "cluster"
    column: "cluster_label"
  - term: "cluster segment"
    column: "cluster_label"
  - term: "rfm"
    column: "rfm_segment"
  - term: "cabang"
    column: "cabang_name"
  - term: "kota"
    column: "kota"
  - term: "saldo"
    column: "saldo_t0"
  - term: "saldo rekening"
    column: "saldo_t0"
  - term: "jenis produk"
    column: "jenis_rekening"
  - term: "syariah"
    column: "jenis = 'SYARIAH'"
  - term: "konvensional"
    column: "jenis = 'KONVEN'"
  - term: "credit score"
    column: "credit_score"
  - term: "skor kredit"
    column: "credit_score"
  - term: "risiko kredit"
    column: "credit_risk_label"
  - term: "credit risk"
    column: "credit_risk_label"
  - term: "churn"
    column: "churn_probability"
  - term: "probability churn"
    column: "churn_probability"
  - term: "risiko churn"
    column: "churn_risk_label"
  - term: "adopsi digital"
    column: "digital_banking_adoption"
  - term: "digital adoption"
    column: "digital_banking_adoption"
  - term: "jenis pinjaman"
    column: "loan_type"
  - term: "loan type"
    column: "loan_type"

# -----------------------------------------------------------------------------
# 6. Contoh pertanyaan bisnis — ditampilkan ke LLM sebagai panduan
# Sesuaikan dengan kolom dan istilah yang ada di dataset kamu
# -----------------------------------------------------------------------------
example_questions:
  - "account count by status_rekening (aktif/dormant/tutup)"
  - "account count by cluster_label (segmentasi K-Means)"
  - "average saldo_t0 by cluster_label"
  - "rfm_segment distribution across all accounts"
  - "account count by jenis (SYARIAH vs KONVEN)"
  - "top 10 kota by total saldo_t0"
  - "average hari_sejak_trx by status_rekening"
  - "distribution by age_group and jenis_kelamin_label"
  - "average credit_score by cluster_label"
  - "credit_risk_label distribution (GOOD/FAIR/POOR/BAD)"
  - "average churn_probability by status_rekening"
  - "count accounts by churn_risk_label"
  - "digital_banking_adoption breakdown by cluster_label"
  - "loan_type distribution by cluster_label"
  - "accounts with credit_risk_label = 'BAD' and churn_risk_label = 'HIGH'"
  - "average credit_score for dormant accounts (status_rekening = 1)"
  - "count by rfm_segment and credit_risk_label"
  - "top 5 cabang by average saldo_t0"

# -----------------------------------------------------------------------------
# 7. SQL behavior rules tambahan — opsional
# Baris-baris ini ditambahkan ke SQL generation rules di system prompt.
# Gunakan untuk GROUP BY pattern atau filter yang spesifik ke domain kamu.
# -----------------------------------------------------------------------------
sql_extra_rules:
  - "status_rekening is an integer: 0=Aktif, 1=Dormant, 2=Tutup — never CAST, filter with WHERE status_rekening = 1."
  - "For dormancy analysis: WHERE status_rekening = 1 or GROUP BY status_rekening or status_label."
  - "For cluster/segment analysis: GROUP BY cluster_label."
  - "For RFM analysis: GROUP BY rfm_segment."
  - "For credit risk distribution: GROUP BY credit_risk_label. Values are GOOD, FAIR, POOR, BAD — never HIGH/MEDIUM/LOW."
  - "For churn analysis: GROUP BY churn_risk_label. Values are HIGH, MEDIUM, LOW — never GOOD/FAIR/POOR/BAD."
  - "CRITICAL: 'credit risk HIGH' or 'risiko kredit tinggi' means churn_risk_label = 'HIGH', NOT credit_risk_label."
  - "CRITICAL: credit_risk_label values = GOOD/FAIR/POOR/BAD. churn_risk_label values = HIGH/MEDIUM/LOW. Never mix these."
  - "For digital adoption analysis: GROUP BY digital_banking_adoption. Values are Active, Passive, None."
  - "For loan product analysis: GROUP BY loan_type. Values are KPR, KKB, KTA, None."
  - "credit_score is an integer (300-850); use AVG() for aggregation."
  - "churn_probability is a float (0-1); use AVG() for aggregation, or filter with WHERE churn_probability > 0.7."
  - "saldo_t0 is a DOUBLE in Rupiah; use SUM() or AVG() — no CAST needed. For 'saldo tinggi' use ORDER BY saldo_t0 DESC."
  - "saldo_segment values are: Premium, High, Medium, Low — use this for segmented balance analysis."
  - "jenis column values are 'SYARIAH' or 'KONVEN' (uppercase)."
  - "For 'nasabah dengan saldo tinggi': use ORDER BY saldo_t0 DESC or WHERE saldo_t0 > (SELECT AVG(saldo_t0) FROM table)."
  - "umur=0 means age data is missing — always add WHERE umur > 0 when filtering or grouping by age."

# -----------------------------------------------------------------------------
# 8. Pesan guardrail out-of-scope
# Dipakai ketika user bertanya di luar domain yang didukung
# -----------------------------------------------------------------------------
guardrail_out_of_scope_en: >
  This assistant is focused on customer segmentation, credit risk, churn prediction, and behavioral analytics.
  Try asking about credit scores, churn probability, dormancy risk levels, campaign recommendations,
  digital banking adoption, or balance distribution.

guardrail_out_of_scope_id: >
  Asisten ini difokuskan pada analitik segmentasi nasabah, credit risk, prediksi churn, dan behavioral analytics.
  Coba tanyakan tentang credit score, churn probability, tingkat risiko dormant, rekomendasi kampanye,
  adopsi digital banking, atau distribusi saldo.

# -----------------------------------------------------------------------------
# 9. Ambiguity guidance — panduan interpretasi pertanyaan ambigu
# -----------------------------------------------------------------------------
ambiguity_guidance:
  - "All data is in one table — no joins needed."
  - "For 'dormant customers': WHERE status_rekening = 1."
  - "For segment distribution: GROUP BY cluster_label."
  - "For balance analysis: use saldo_t0 (account balance). 'Saldo tinggi' = ORDER BY saldo_t0 DESC."
  - "For credit risk: use credit_risk_label (GOOD/FAIR/POOR/BAD) or credit_score (300-850)."
  - "For churn risk: use churn_risk_label (HIGH/MEDIUM/LOW) or churn_probability (0-1)."
  - "IMPORTANT: 'risiko tinggi' or 'HIGH risk' without context = churn_risk_label = 'HIGH'."
  - "For digital adoption: use digital_banking_adoption (Active/Passive/None)."
  - "For loan products: use loan_type (KPR/KKB/KTA/None)."
  - "For age analysis: always filter WHERE umur > 0 to exclude records with missing age data."
  - "If a question is broad, return a practical preview query with LIMIT 20 applied."

# -----------------------------------------------------------------------------
# 10. Agent System Prompts — semua prompt agent dikonfigurasi di sini
# -----------------------------------------------------------------------------

# SQL Agent: mengubah pertanyaan user menjadi SQL Impala
prompt_sql_agent: ""

# Answer Agent: menjelaskan hasil SQL ke user dalam bahasa bisnis
prompt_answer_agent: |
  You are Bank XYZ Data Analyst Assistant, a business-friendly banking analytics assistant.
  Your job is to explain query results clearly and naturally to a business user.

  Grounding rules:
  - Use only the evidence in the provided SQL result preview.
  - Never invent values, trends, causes, explanations, or business assumptions.
  - Never claim anything that is not directly supported by the rows and columns provided.
  - If no records are found, say so naturally.
  - If the preview is truncated, mention that only a preview is shown.

  Style rules:
  - Sound like a helpful human analyst, not a technical system.
  - CRITICAL: Always respond in the SAME language as the user's question. If the question is in Bahasa Indonesia, your entire answer MUST be in Bahasa Indonesia — no English words or sentences. If the question is in English, answer entirely in English.
  - Match the language exactly — do not mix languages.
  - Focus on the key takeaway first.
  - Use plain business language.
  - Be concise but complete.
  - Avoid robotic phrasing and repetition.
  - Avoid phrases like "The SQL query returned..." unless absolutely necessary.
  - Do not restate the full table or repeat every row unless needed.
  - Do not mention internal implementation details unless they help the user understand an important limitation.

# Conversation Agent: handling greetings, small talk, clarification
prompt_conversation_agent: ""

# RAG Agent (Bahasa Indonesia)
prompt_rag_agent_id: |
  Anda adalah asisten analitik Bank XYZ.
  PENTING: Anda HARUS menjawab SELURUHNYA dalam Bahasa Indonesia.
  Dilarang keras menggunakan kata atau kalimat dalam bahasa Inggris.
  Gunakan bahasa yang jelas, natural, dan profesional.
  Jawab hanya berdasarkan konteks dokumen yang diberikan.
  Jika informasi tidak tersedia di dokumen, katakan dengan natural dalam Bahasa Indonesia.

# RAG Agent (English)
prompt_rag_agent_en: |
  You are an analytics assistant for Bank XYZ.
  IMPORTANT: You MUST answer entirely in English.
  Use clear, natural, and professional language.
  Answer only based on the provided document context.
  If the information is not in the documents, say so naturally in English.
